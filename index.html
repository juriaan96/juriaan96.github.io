<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinterklaasklok</title>
<meta name="description" content="Een gezellige Sinterklaasklok die de actuele tijd aangeeft, bij een knapperend haardvuur.">
<meta name="theme-color" content="#1a0a0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 58V32C14 20 23 10 32 4c9 6 18 16 18 28v26z' fill='%23b3202a'/%3E%3Cpath d='M14 48h36v10H14z' fill='%23d9a93f'/%3E%3Cpath d='M29 14h6v8h8v6h-8v14h-6V28h-8v-6h8z' fill='%23f3d27a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@600&family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: warm en gezellig, een Hollandse woonkamer op een decemberavond
IDEA: een antieke schoorsteenklok met een mijter als kroon, boven een brandende haard
PICTURE: een gelaagde SVG-kamer met een canvas-vuur, kaarsen, chocoladeletter en een klomp met wortel
COLOUR and TYPE: wijnrode wand, Sint-rood, goud, gloeiend oranje; Fraunces, Cinzel-cijfers, Nunito Sans
LAYOUT: bescheiden titel, de kamer groot in het midden, tijd en aftellen eronder
*/
:root{color-scheme:dark;--bg:#1a0a0d;--ink:#f6e7c8;--muted:#d4b994;--red:#b3202a;--gold:#d9a93f;--goldl:#f3d27a;--glow:.5}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 90% 70% at 50% 35%,#3d1117 0%,#1a0a0d 70%) no-repeat,#1a0a0d;color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
.top{text-align:center;padding:clamp(18px,3vw,32px) max(5vw,16px) 0}
h1{margin:0;font:600 clamp(32px,5vw,50px)/1.05 Fraunces,Georgia,serif;color:var(--goldl);text-wrap:balance}
.top p{margin:6px 0 0;color:var(--muted);font-size:17px}
.stage{position:relative;margin:4px auto 0;aspect-ratio:10/9;width:min(100%,1040px,max(560px,calc((100vh - 250px)*1.111)));-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 95%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 95%,transparent);mask-composite:intersect}
@supports(height:100svh){.stage{width:min(100%,1040px,max(560px,calc((100svh - 250px)*1.111)))}}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}
#fire{position:absolute;left:33%;top:62.2222%;width:34%;height:26.6667%;display:block;border-radius:50% 50% 0 0/32.5% 32.5% 0 0}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 62% 48% at 50% 80%,rgba(255,150,60,.55),rgba(255,110,40,.16) 48%,transparent 72%);mix-blend-mode:screen;opacity:var(--glow)}
.shoe{position:absolute;left:20%;top:85%;width:18%;height:13.5%;padding:0;margin:0;border:0;background:transparent;border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shoe:focus-visible{outline:3px solid var(--goldl);outline-offset:2px}
.bubble{position:absolute;left:14%;bottom:17%;width:max-content;max-width:min(50%,340px);margin:0;padding:10px 14px;background:#f6e7c8;color:#3a170f;border-radius:14px;font-size:clamp(13px,1.7vw,16px);line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;left:30px;bottom:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#f6e7c8}
.panel{max-width:1040px;margin:0 auto;padding:8px max(5vw,16px) 8px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 40px;align-items:center}
.time{display:block;font:600 clamp(44px,7vw,68px)/1 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.date{margin-top:8px;color:var(--muted);font-size:17px}
.count{margin:0;font:600 clamp(20px,2.4vw,26px)/1.2 Fraunces,Georgia,serif;color:var(--goldl);text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted)}
.sound{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(243,210,122,.55);background:rgba(243,210,122,.08);color:var(--ink);font:600 16px/1 "Nunito Sans",system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sound:hover{background:rgba(243,210,122,.16)}
.sound:focus-visible{outline:3px solid var(--goldl);outline-offset:3px}
.sound.on{background:var(--gold);color:#2a1208;border-color:var(--gold)}
.sound:disabled{opacity:.55;cursor:default}
.hint{margin:14px auto 0;padding:0 16px;text-align:center;color:var(--muted);font-size:15px}
footer{padding:20px 16px 32px;text-align:center;color:#a88c6c;font-size:14px}
@media(max-width:720px){.panel{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:14px}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite alternate}
.flame.b{animation-duration:1.7s;animation-delay:-.6s}
.halo{animation:halo 2.1s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(0deg)}30%{transform:scale(.94,1.06) skewX(2deg)}60%{transform:scale(1.04,.95) skewX(-2deg)}100%{transform:scale(.97,1.04) skewX(1deg)}}
@keyframes halo{from{opacity:.75}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.flame,.halo{animation:none}.bubble{transition:none}}
</style>
</head>

      <path d="M48 -6l6 3M56 -20l6 3M42 6l5 3" stroke="#c35f12" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M68 -40C62 -56 58 -62 52 -64M70 -41C70 -58 72 -64 76 -68M73 -40C80 -54 86 -58 92 -58" fill="none" stroke="#4f8a3a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="gift" style="display:none">
      <rect x="24" y="-14" width="30" height="26" rx="2" fill="#b3202a"/>
      <rect x="36" y="-14" width="6" height="26" fill="#f3d27a"/>
      <rect x="24" y="-4" width="30" height="5" fill="#f3d27a"/>
      <ellipse cx="34" cy="-17" rx="6" ry="3.5" fill="#f3d27a"/>
      <ellipse cx="44" cy="-17" rx="6" ry="3.5" fill="#f3d27a"/>
      <circle cx="58" cy="6" r="7" fill="#d9a93f" stroke="#8f6420"/>
    </g>
    <path d="M16 15A24 5.5 0 0 0 64 15" fill="none" stroke="#e5bd62" stroke-width="3"/>
  </g>
</svg>

<div class="glow" aria-hidden="true"></div>
<button class="shoe" id="shoe" type="button" aria-label="Kijk in de klomp"></button>
<p class="bubble" id="bubble" role="status" aria-live="polite"></p>
</div>

<section class="panel" aria-label="Tijd en aftellen">
  <div>
    <time class="time" id="dtime">00:00:00</time>
    <div class="date" id="ddate"></div>
  </div>
  <div>
    <p class="count" id="count"></p>
    <p class="sub" id="count2"></p>
  </div>
  <button class="sound" id="sound" type="button">Haardgeluid aanzetten</button>
</section>
<p class="hint">Klik op de klomp om te kijken of Sinterklaas al langs is geweest.</p>
</main>

<footer>Fijne Sinterklaastijd!</footer>

<script>
{
const $ = id => document.getElementById(id);
const R = Math.random;
const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* wijzerplaat */
const roman = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
let dial = '';
for (let i = 0; i < 60; i++) {
  const a = i * Math.PI / 30, major = i % 5 === 0, r1 = major ? 56 : 61, r2 = 65, s = Math.sin(a), c = Math.cos(a);
  dial += `<line x1="${(500 + s * r1).toFixed(2)}" y1="${(236 - c * r1).toFixed(2)}" x2="${(500 + s * r2).toFixed(2)}" y2="${(236 - c * r2).toFixed(2)}" stroke="#3a1a10" stroke-width="${major ? 2.2 : 1}" stroke-linecap="round"/>`;
}
for (let k = 0; k < 12; k++) {
  dial += `<text x="500" y="188" transform="rotate(${k * 30} 500 236)" text-anchor="middle" dominant-baseline="central" font-family="Cinzel, Georgia, serif" font-weight="600" font-size="10.5" fill="#3a1a10">${roman[k]}</text>`;
}
$('dial').innerHTML = dial;

/* slinger met vlaggetjes */
const cols = ['#b3202a', '#d9a93f', '#f3e6c8'];
const P0 = [-10, 26], P1 = [500, 126], P2 = [1010, 26];
let flags = '';
const nFlags = 22;
for (let i = 0; i < nFlags; i++) {
  const t = (i + 0.5) / nFlags, u = 1 - t;
  const x = u * u * P0[0] + 2 * u * t * P1[0] + t * t * P2[0];
  const y = u * u * P0[1] + 2 * u * t * P1[1] + t * t * P2[1];
  const dx = 2 * u * (P1[0] - P0[0]) + 2 * t * (P2[0] - P1[0]);
  const dy = 2 * u * (P1[1] - P0[1]) + 2 * t * (P2[1] - P1[1]);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  flags += `<path d="M-19 0L19 0L0 44Z" fill="${cols[i % 3]}" stroke="#000" stroke-opacity=".2" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})"/>`;
}
$('bunting').innerHTML = flags;

/* geluid */
let ac = null, master = null, wbuf = null, soundOn = false, crackT = null;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC();
  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  const len = Math.floor(ac.sampleRate * 3);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const w = R() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 500;
  const g = ac.createGain(); g.gain.value = 0.35;
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start();
  wbuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.2), ac.sampleRate);
  const wd = wbuf.getChannelData(0);
  for (let i = 0; i < wd.length; i++) wd[i] = R() * 2 - 1;
}
function burst(freq, q, vol, dur, delay) {
  const n = ac.currentTime + delay;
  const src = ac.createBufferSource(); src.buffer = wbuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(n, R() * 0.1, dur + 0.02);
}
function crackleLoop() {
  if (!soundOn) return;
  const count = R() < 0.15 ? 3 + Math.floor(R() * 4) : 1;
  for (let i = 0; i < count; i++) burst(1200 + R() * 4000, 1 + R() * 3, 0.05 + R() * 0.35, 0.02 + R() * 0.06, i * 0.015 + R() * 0.02);
  crackT = setTimeout(crackleLoop, 40 + R() * 260);
}
function tick(hi) { if (ac) burst(hi ? 3400 : 2600, 6, 0.5, 0.035, 0); }
const btn = $('sound');
btn.addEventListener('click', () => {
  try {
    if (!ac) initAudio();
    soundOn = !soundOn;
    btn.textContent = soundOn ? 'Haardgeluid uitzetten' : 'Haardgeluid aanzetten';
    btn.classList.toggle('on', soundOn);
    clearTimeout(crackT);
    master.gain.cancelScheduledValues(ac.currentTime);
    if (soundOn) {
      const p = ac.resume(); if (p && p.catch) p.catch(() => {});
      master.gain.setTargetAtTime(0.8, ac.currentTime, 0.15);
      crackleLoop();
    } else {
      master.gain.setTargetAtTime(0, ac.currentTime, 0.08);
    }
  } catch (e) {
    soundOn = false;
    btn.disabled = true;
    btn.classList.remove('on');
    btn.textContent = 'Geluid niet beschikbaar';
  }
});

/* klok, datum en aftellen */
const hh = $('hh'), mh = $('mh'), sh = $('sh'), pend = $('pend');
const tEl = $('dtime'), dEl = $('ddate'), cEl = $('count'), c2El = $('count2');
const fmtDate = new Intl.DateTimeFormat('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtWd = new Intl.DateTimeFormat('nl-NL', { weekday: 'long' });
const pad = n => String(n).padStart(2, '0');
let lastSec = -1, lastDay = '';
function easeTick(p) {
  if (reduce || p >= 0.18) return 1;
  const q = p / 0.18, c1 = 1.2, c3 = c1 + 1;
  return 1 + c3 * Math.pow(q - 1, 3) + c1 * Math.pow(q - 1, 2);
}
function updDay(now) {
  const ds = fmtDate.format(now);
  dEl.textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
  const y = now.getFullYear(), day = 864e5;
  const today = Date.UTC(y, now.getMonth(), now.getDate());
  const d = Math.round((Date.UTC(y, 11, 5) - today) / day);
  let main, sub;
  if (d > 1) { main = `Nog ${d} nachtjes slapen tot pakjesavond`; sub = `Pakjesavond valt dit jaar op ${fmtWd.format(new Date(y, 11, 5))} 5 december.`; }
  else if (d === 1) { main = 'Nog 1 nachtje slapen: morgen is het pakjesavond!'; sub = `Morgen, ${fmtWd.format(new Date(y, 11, 5))} 5 december, komt Sinterklaas langs.`; }
  else if (d === 0) { main = 'Vanavond is het pakjesavond!'; sub = 'Luister goed: zo wordt er op de deur gebonsd.'; }
  else if (d === -1) { main = 'Vandaag is Sinterklaas jarig!'; sub = 'Gefeliciteerd, Sint, en bedankt voor alle cadeautjes.'; }
  else {
    const d2 = Math.round((Date.UTC(y + 1, 11, 5) - today) / day);
    main = `Sinterklaas is terug in Spanje. Nog ${d2} nachtjes tot pakjesavond`;
    sub = `Volgend jaar valt pakjesavond op ${fmtWd.format(new Date(y + 1, 11, 5))} 5 december.`;
  }
  cEl.textContent = main;
  c2El.textContent = sub;
}
function updClock(now) {
  const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
  const sf = s - 1 + easeTick(ms / 1000);
  sh.setAttribute('transform', `translate(500 236) rotate(${(sf * 6).toFixed(2)})`);
  mh.setAttribute('transform', `translate(500 236) rotate(${((m + s / 60) * 6).toFixed(2)})`);
  hh.setAttribute('transform', `translate(500 236) rotate(${((h % 12 + m / 60) * 30).toFixed(2)})`);
  const pa = reduce ? 0 : 7 * Math.sin(Math.PI * (now.getTime() % 2000) / 1000);
  pend.setAttribute('transform', `rotate(${pa.toFixed(2)} 500 314)`);
  if (s !== lastSec) {
    lastSec = s;
    tEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    tEl.setAttribute('datetime', `${pad(h)}:${pad(m)}:${pad(s)}`);
    if (soundOn) tick(s % 2 === 0);
    const dk = now.toDateString();
    if (dk !== lastDay) { lastDay = dk; updDay(now); }
  }
}

/* haardvuur */
const stage = $('stage'), cv = $('fire'), cx = cv.getContext('2d');
const FW = 340, FH = 240;
function fit() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  cx.setTransform(w / FW, 0, 0, h / FH, 0, 0);
}
const fireObserver = new ResizeObserver(fit);
fireObserver.observe(cv);
fit();

const stops = [[0, [255, 247, 214]], [0.25, [255, 206, 96]], [0.55, [245, 124, 36]], [0.8, [170, 52, 22]], [1, [90, 24, 14]]];
function col(t) {
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const t0 = stops[i - 1][0], a = stops[i - 1][1], t1 = stops[i][0], b = stops[i][1], f = (t - t0) / (t1 - t0);
      return a.map((v, j) => Math.round(v + (b[j] - v) * f));
    }
  }
  return stops[stops.length - 1][1];
}
const sprites = [];
for (let i = 0; i < 24; i++) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), rgb = col(i / 23).join(',');
  const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, `rgba(${rgb},1)`); rg.addColorStop(0.35, `rgba(${rgb},.55)`); rg.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  sprites.push(c);
}
const parts = [], sparks = [];
let acc = 0, noise = 0;
function spawn() {
  parts.push({ x: 170 + (R() + R() + R() - 1.5) * 64, y: 202 + R() * 12, vx: (R() - 0.5) * 14, vy: -(55 + R() * 65), life: 0, max: 0.9 + R() * 1.0, size: 26 + R() * 26, seed: R() * 6.28 });
}
function drawLog(x1, y1, x2, y2, r, glow) {
  const a = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1);
  cx.save();
  cx.translate(x1, y1); cx.rotate(a);
  const g = cx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, '#6a3e24'); g.addColorStop(0.5, '#3e2213'); g.addColorStop(1, '#1e0f07');
  cx.fillStyle = g;
  cx.beginPath(); cx.ellipse(0, 0, r * 0.45, r, 0, 0, Math.PI * 2); cx.fill();
  cx.fillRect(0, -r, len, 2 * r);
  cx.strokeStyle = 'rgba(0,0,0,.35)'; cx.lineWidth = 1.2;
  cx.beginPath();
  cx.moveTo(8, -r * 0.3); cx.lineTo(len * 0.55, -r * 0.35);
  cx.moveTo(len * 0.3, r * 0.25); cx.lineTo(len - 10, r * 0.2);
  cx.stroke();
  cx.fillStyle = '#b07a4a';
  cx.beginPath(); cx.ellipse(len, 0, r * 0.45, r, 0, 0, Math.PI * 2); cx.fill();
  cx.strokeStyle = '#6e4426'; cx.lineWidth = 1;
  cx.beginPath(); cx.ellipse(len, 0, r * 0.25, r * 0.55, 0, 0, Math.PI * 2); cx.stroke();
  if (glow) {
    cx.globalCompositeOperation = 'lighter';
    cx.strokeStyle = `rgba(255,${110 + Math.round(40 * glow)},40,${(0.35 + 0.3 * glow).toFixed(3)})`;
    cx.lineWidth = 2.2;
    cx.beginPath(); cx.moveTo(6, -r * 0.55); cx.lineTo(len - 4, -r * 0.62); cx.stroke();
  }
  cx.restore();
}
function drawGrate() {
  cx.fillStyle = '#2a1810';
  cx.beginPath(); cx.ellipse(170, 236, 122, 7, 0, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#17100c';
  cx.fillRect(56, 226, 228, 7);
  for (const x of [70, 270]) {
    cx.fillRect(x - 4, 198, 8, 42);
    cx.beginPath(); cx.arc(x, 196, 7, 0, Math.PI * 2); cx.fill();
  }
  cx.fillStyle = 'rgba(255,170,90,.25)';
  cx.fillRect(56, 226, 228, 1.2);
}
function fire(dt, time) {
  noise += (R() - 0.5) * dt * 3; noise *= 0.97;
  noise = Math.max(-0.15, Math.min(0.15, noise));
  const I = reduce ? 0.9 : 0.86 + 0.07 * Math.sin(time * 1.9) + 0.05 * Math.sin(time * 5.3 + 1.3) + noise;
  stage.style.setProperty('--glow', (0.3 + 0.32 * I).toFixed(3));

  cx.globalCompositeOperation = 'source-over';
  cx.globalAlpha = 1;
  cx.clearRect(0, 0, FW, FH);
  let g = cx.createRadialGradient(170, 200, 10, 170, 190, 200);
  g.addColorStop(0, `rgba(255,130,50,${(0.34 * I).toFixed(3)})`); g.addColorStop(1, 'rgba(255,90,30,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, FW, FH);

  drawLog(60, 200, 280, 190, 13, 0);

  acc += dt * (reduce ? 90 : 190) * I;
  while (acc >= 1) { acc -= 1; spawn(); }
  cx.globalCompositeOperation = 'lighter';
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    const t = p.life / p.max;
    if (t >= 1) { parts.splice(i, 1); continue; }
    p.vy -= 34 * dt;
    p.x += (p.vx + Math.sin(time * 3.1 + p.seed) * 16 * t + (170 - p.x) * 0.9 * t) * dt;
    p.y += p.vy * dt;
    const s = p.size * (1 - 0.7 * t);
    cx.globalAlpha = (t < 0.12 ? t / 0.12 : 1) * (1 - t) * 0.85;
    cx.drawImage(sprites[Math.min(23, Math.floor(t * 24))], p.x - s / 2, p.y - s / 2, s, s);
  }
  cx.globalAlpha = 1;

  if (!reduce && R() < dt * 5 * I) sparks.push({ x: 150 + R() * 40, y: 190, vx: (R() - 0.5) * 30, vy: -(70 + R() * 90), life: 0, max: 0.9 + R() * 1.1 });
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.life += dt;
    if (p.life >= p.max || p.y < 0) { sparks.splice(i, 1); continue; }
    p.vx += (R() - 0.5) * 160 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const a = 1 - p.life / p.max;
    cx.fillStyle = `rgba(255,${180 + Math.round(60 * a)},120,${a.toFixed(3)})`;
    cx.fillRect(p.x, p.y, 1.8, 1.8);
  }

  g = cx.createRadialGradient(170, 232, 4, 170, 232, 120);
  g.addColorStop(0, `rgba(255,150,60,${(0.55 * I).toFixed(3)})`); g.addColorStop(1, 'rgba(255,80,20,0)');
  cx.fillStyle = g; cx.fillRect(40, 190, 260, 50);
  cx.globalCompositeOperation = 'source-over';

  drawLog(78, 224, 232, 207, 13, I);
  drawLog(118, 206, 272, 225, 12, I);
  drawGrate();
}

/* klomp */
const gifts = ['een chocoladeletter', 'een handje pepernoten', 'een marsepeinen varkentje', 'een speculaaspop', 'een taaitaaipop', 'een suikerbeest', 'een zakje chocolademunten', 'een chocolademuis'];
const shoe = $('shoe'), bubble = $('bubble'), carrot = $('carrot'), gift = $('gift');
let filled = false, lastGift = -1, bubT = null;
shoe.addEventListener('click', () => {
  filled = !filled;
  carrot.style.display = filled ? 'none' : '';
  gift.style.display = filled ? '' : 'none';
  let msg;
  if (filled) {
    let i;
    do { i = Math.floor(R() * gifts.length); } while (i === lastGift);
    lastGift = i;
    msg = `Het paard heeft de wortel opgegeten, en Sinterklaas liet ${gifts[i]} achter!`;
  } else {
    msg = 'Er zit weer een verse wortel in de klomp. Hij staat klaar voor vannacht.';
  }
  bubble.textContent = msg;
  bubble.classList.add('show');
  shoe.setAttribute('aria-label', filled ? 'Zet de klomp opnieuw met een wortel' : 'Kijk in de klomp');
  clearTimeout(bubT);
  bubT = setTimeout(() => bubble.classList.remove('show'), 5000);
});

/* animatielus */
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
  lastT = t;
  updClock(new Date());
  fire(dt, t / 1000);
  requestAnimationFrame(frame);
}
updClock(new Date());
requestAnimationFrame(frame);
}
</script>
