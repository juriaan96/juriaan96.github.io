<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinterklaasklok</title>
<meta name="description" content="Een gezellige Sinterklaasklok die de actuele tijd aangeeft, bij een knapperend haardvuur.">
<meta name="theme-color" content="#1a0a0d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 58V32C14 20 23 10 32 4c9 6 18 16 18 28v26z' fill='%23b3202a'/%3E%3Cpath d='M14 48h36v10H14z' fill='%23d9a93f'/%3E%3Cpath d='M29 14h6v8h8v6h-8v14h-6V28h-8v-6h8z' fill='%23f3d27a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/*
VOICE: warm en gezellig, een Hollandse woonkamer op een decemberavond
IDEA: een antieke schoorsteenklok met een mijter als kroon, boven een brandende haard
PICTURE: een gelaagde SVG-kamer met een canvas-vuur, kaarsen, chocoladeletter en een klomp met wortel
COLOUR and TYPE: wijnrode wand, Sint-rood, goud, gloeiend oranje; Fraunces, Cinzel-cijfers, Nunito Sans
LAYOUT: bescheiden titel, de kamer groot in het midden, tijd en aftellen eronder
*/
:root{color-scheme:dark;--bg:#1a0a0d;--ink:#f6e7c8;--muted:#d4b994;--red:#b3202a;--gold:#d9a93f;--goldl:#f3d27a;--glow:.5}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 90% 70% at 50% 35%,#3d1117 0%,#1a0a0d 70%) no-repeat,#1a0a0d;color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
.top{text-align:center;padding:clamp(18px,3vw,32px) max(5vw,16px) 0}
h1{margin:0;font:600 44px/1.05 Fraunces,Georgia,serif;font:600 clamp(32px,5vw,50px)/1.05 Fraunces,Georgia,serif;color:var(--goldl);text-wrap:balance}
.top p{margin:6px 0 0;color:var(--muted);font-size:17px}
.stage{position:relative;margin:4px auto 0;width:100%;max-width:1040px;width:min(100%,1040px,max(560px,calc((100vh - 250px)*1.111)));-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 95%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 95%,transparent);mask-composite:intersect}
.stage::before{content:"";display:block;padding-top:90%}
@supports(height:100svh){.stage{width:min(100%,1040px,max(560px,calc((100svh - 250px)*1.111)))}}
.stage>svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;overflow:hidden}
#fire{position:absolute;left:33%;top:62.2222%;width:34%;height:26.6667%;display:block;border-radius:50% 50% 0 0/32.5% 32.5% 0 0}
.glow{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(ellipse 62% 48% at 50% 80%,rgba(255,150,60,.55),rgba(255,110,40,.16) 48%,transparent 72%);mix-blend-mode:screen;opacity:var(--glow)}
.shoe{position:absolute;left:20%;top:85%;width:18%;height:13.5%;padding:0;margin:0;border:0;background:transparent;border-radius:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shoe:focus-visible{outline:3px solid var(--goldl);outline-offset:2px}
.hit{position:absolute;padding:0;margin:0;border:0;background:transparent;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{outline:3px solid var(--goldl);outline-offset:2px}
.night{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:#07040f;opacity:var(--night,0)}
.bubble{position:absolute;left:14%;bottom:17%;z-index:2;width:max-content;max-width:56%;max-width:min(56%,360px);margin:0 0 0 -38px;padding:10px 14px;background:#f6e7c8;color:#3a170f;border-radius:14px;font-size:clamp(13px,1.7vw,16px);line-height:1.35;white-space:pre-line;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.r{margin:0 -38px 0 0}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;left:30px;bottom:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#f6e7c8}
.bubble.r::after{left:auto;right:30px}
#rain{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:20}
.shake{transform-box:fill-box;transform-origin:50% 100%;animation:shake .6s ease-in-out}
@keyframes shake{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.puff{transform-box:fill-box;transform-origin:50% 50%;animation:puff 1.8s ease-out forwards}
@keyframes puff{from{opacity:.6;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(6px,-36px) scale(3.2)}}
.eggs{margin:6px 0 0;color:var(--goldl);font-size:14px}
.panel{max-width:1040px;margin:0 auto;padding:8px max(5vw,16px) 8px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 40px;align-items:center}
.time{display:block;font:600 60px/1 Fraunces,Georgia,serif;font:600 clamp(44px,7vw,68px)/1 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.date{margin-top:8px;color:var(--muted);font-size:17px}
.count{margin:0;font:600 24px/1.2 Fraunces,Georgia,serif;font:600 clamp(20px,2.4vw,26px)/1.2 Fraunces,Georgia,serif;color:var(--goldl);text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted)}
.sound{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(243,210,122,.55);background:rgba(243,210,122,.08);color:var(--ink);font:600 16px/1 "Nunito Sans",system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.controls{display:flex;flex-direction:column;align-items:center}
.ctl-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.ctl-row+.ctl-row{margin-top:10px}
.ctl-row>*{margin:4px 5px}
.lbl{color:var(--muted);font-size:15px}
.sel{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(243,210,122,.55);background:#2a1114;color:var(--ink);font:600 16px/1.2 "Nunito Sans",system-ui,sans-serif;cursor:pointer;max-width:100%}
.sel:focus-visible{outline:3px solid var(--goldl);outline-offset:3px}
.radio-stat{margin:8px 0 0;min-height:1.4em;color:var(--muted);font-size:14px;text-align:center;max-width:34ch}
.sound:hover{background:rgba(243,210,122,.16)}
.sound:focus-visible{outline:3px solid var(--goldl);outline-offset:3px}
.sound.on{background:var(--gold);color:#2a1208;border-color:var(--gold)}
.sound:disabled{opacity:.55;cursor:default}
.xmas{max-width:1040px;margin:18px auto 0;padding:22px max(5vw,16px) 6px;border-top:1px solid rgba(243,210,122,.25);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 40px;align-items:center}
.xmas h2{margin:0;font:600 24px/1.2 Fraunces,Georgia,serif;font:600 clamp(20px,2.4vw,26px)/1.2 Fraunces,Georgia,serif;color:var(--goldl)}
.xm-row{display:flex}
.xm-row>div+div{margin-left:22px}
.xm-row[hidden]{display:none}
.xm-row>div{display:flex;flex-direction:column;align-items:center;min-width:2.6em}
.xm-n{font:600 44px/1 Fraunces,Georgia,serif;font:600 clamp(34px,5vw,48px)/1 Fraunces,Georgia,serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.xm-l{margin-top:4px;font-size:14px;color:var(--muted)}
@media(max-width:720px){.xmas{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.hint{margin:14px auto 0;padding:0 16px;text-align:center;color:var(--muted);font-size:15px}
footer{padding:20px 16px 32px;text-align:center;color:#a88c6c;font-size:14px}
@media(max-width:720px){.panel{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:14px}}
/* beeldvullend op liggende schermen: vast ontwerp van 1600x1000 (16:10) dat meeschaalt */
html.fit,html.fit body{height:100%;overflow:hidden}
html.fit body{min-height:0}
html.fit .app{position:absolute;left:50%;top:50%;width:1600px;height:1000px;margin:-500px 0 0 -800px;padding:24px 44px 24px 12px;display:grid;grid-template-columns:1058px 1fr;grid-template-rows:auto 1fr;column-gap:40px;-webkit-transform-origin:50% 50%;transform-origin:50% 50%}
html.fit .stage{grid-column:1;grid-row:1/3;width:1058px;max-width:none;margin:0;align-self:center}
html.fit .top{grid-column:2;grid-row:1;padding:26px 0 0}
html.fit h1{font-size:58px}
html.fit .top p{font-size:19px}
html.fit .side{grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:center;min-height:0}
html.fit .panel{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;padding:0;gap:16px;max-width:none}
html.fit .time{font-size:92px}
html.fit .date{font-size:19px}
html.fit .count{font-size:29px}
html.fit .sub{font-size:17px}
html.fit .xmas{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;margin:26px 0 0;padding:22px 0 0;max-width:none}
html.fit .xmas h2{font-size:27px}
html.fit .xm-n{font-size:54px}
html.fit .xm-l{font-size:15px}
html.fit .hint{font-size:15px;margin-top:18px;padding:0}
html.fit .radio-stat{max-width:none}
html.fit footer{padding:12px 0 0}
html.fit .bubble{font-size:17px}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite alternate}
.flame.b{animation-duration:1.7s;animation-delay:-.6s}
.halo{animation:halo 2.1s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(0deg)}30%{transform:scale(.94,1.06) skewX(2deg)}60%{transform:scale(1.04,.95) skewX(-2deg)}100%{transform:scale(.97,1.04) skewX(1deg)}}
@keyframes halo{from{opacity:.75}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.flame,.halo{animation:none}.bubble{transition:none}}
</style>
</head>
<body>
<main class="app" id="app">
<header class="top">
  <h1>Sinterklaasklok</h1>
  <p id="tagline">Het vuur brandt, de klomp staat klaar.</p>
</header>
<div class="stage" id="stage">
<svg viewBox="0 0 1000 900" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="paper" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#5a141a"/>
      <path d="M30 4 46 30 30 56 14 30Z" fill="none" stroke="#6e1b22" stroke-width="2"/>
      <circle cx="30" cy="30" r="3" fill="#d9a93f" opacity=".28"/>
      <circle cx="0" cy="0" r="2.5" fill="#d9a93f" opacity=".18"/>
      <circle cx="60" cy="0" r="2.5" fill="#d9a93f" opacity=".18"/>
      <circle cx="0" cy="60" r="2.5" fill="#d9a93f" opacity=".18"/>
      <circle cx="60" cy="60" r="2.5" fill="#d9a93f" opacity=".18"/>
    </pattern>
    <pattern id="brick" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#3a1912"/>

      <rect x="-31" y="17" width="62" height="14" rx="1.5" fill="#7a3425"/>
      <rect x="33" y="17" width="62" height="14" rx="1.5" fill="#7a3425"/>
    </pattern>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a3a24"/><stop offset="1" stop-color="#341a10"/></linearGradient>
    <linearGradient id="woodS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2e170f"/><stop offset=".5" stop-color="#5a301e"/><stop offset="1" stop-color="#2e170f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7de94"/><stop offset=".5" stop-color="#d9a93f"/><stop offset="1" stop-color="#8f6420"/></linearGradient>
    <radialGradient id="face" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#fff9ea"/><stop offset="1" stop-color="#e6d0a1"/></radialGradient>
    <linearGradient id="mitre" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4343e"/><stop offset="1" stop-color="#861520"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a39484"/><stop offset="1" stop-color="#5c5047"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f2416"/><stop offset="1" stop-color="#1f100a"/></linearGradient>
    <radialGradient id="soot" cx=".5" cy=".85" r=".8"><stop offset="0" stop-color="#2a120a"/><stop offset="1" stop-color="#0b0504"/></radialGradient>
    <radialGradient id="sootUp"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset=".4" stop-color="#ff9f3a" stop-opacity=".18"/><stop offset="1" stop-color="#ff9f3a" stop-opacity="0"/></radialGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9d8b4"/><stop offset=".45" stop-color="#fbf1dc"/><stop offset="1" stop-color="#cdb98f"/></linearGradient>
    <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8a1e"/><stop offset=".45" stop-color="#ffd25a"/><stop offset="1" stop-color="#fff6d8"/></linearGradient>
    <linearGradient id="choc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#83502e"/><stop offset="1" stop-color="#3b1d0e"/></linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#1a0a0d" stop-opacity="0"/><stop offset="1" stop-color="#1a0a0d" stop-opacity=".8"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="bob" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff1b8"/><stop offset=".5" stop-color="#d9a93f"/><stop offset="1" stop-color="#7d5518"/></radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".5"/></filter>
    <clipPath id="win"><rect x="466" y="322" width="68" height="86" rx="10"/></clipPath>
    <mask id="biteMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="900"><rect width="1000" height="900" fill="#fff"/><g id="bites" fill="#000"></g></mask>
  </defs>

  <!-- wand, lambrisering, vloer -->
  <rect width="1000" height="900" fill="url(#paper)"/>
  <rect y="610" width="1000" height="222" fill="#3b0e13"/>
  <rect x="34" y="642" width="118" height="160" rx="4" fill="none" stroke="#56161c" stroke-width="3"/>

  <rect y="830" width="1000" height="70" fill="url(#floor)"/>
  <g stroke="#140a05" stroke-width="2" opacity=".7" fill="none">
    <path d="M0 853H1000M0 877H1000"/>
    <path d="M120 830V853M410 853V877M690 830V853M860 877V900M250 877V900M560 877V900M930 830V853M330 830V853"/>
  </g>
  <path d="M0 831H1000" stroke="#000" stroke-opacity=".5" stroke-width="3"/>

  <!-- slinger -->

    <rect x="254" y="502" width="492" height="298" fill="url(#brick)"/>
    <ellipse cx="500" cy="575" rx="230" ry="90" fill="url(#sootUp)"/>
    <path d="M322 800V638A178 86 0 0 1 678 638V800" fill="none" stroke="url(#stone)" stroke-width="16"/>
    <path d="M486 541h28l-4 26h-20z" fill="#a89888" stroke="#5c5047" stroke-width="1.5"/>
    <path d="M330 800V638A170 78 0 0 1 670 638V800Z" fill="url(#soot)"/>
    <path d="M362 800V662A138 58 0 0 1 638 662V800Z" fill="url(#brick)" opacity=".2"/>
    <path d="M196 454h32v10c0 14-10 24-22 30h-10z" fill="#4a2618"/>
    <path d="M804 454h-32v10c0 14 10 24 22 30h10z" fill="#4a2618"/>
    <rect x="176" y="440" width="648" height="16" fill="#4a2618"/>
    <rect x="160" y="426" width="680" height="16" rx="3" fill="url(#wood)"/>
    <path d="M162 427.5H838" stroke="#f3c98a" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="206" y="800" width="588" height="30" fill="url(#stone)"/>
    <path d="M206 801H794" stroke="#d4c4b0" stroke-opacity=".6" stroke-width="1.5"/>
  </g>

  <!-- chocoladeletter -->
  <g id="letter" mask="url(#biteMask)">
    <text x="255" y="429" text-anchor="middle" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="112" fill="#241006">J</text>
    <text x="250" y="425" text-anchor="middle" font-family="'Archivo Black','Arial Black',Impact,sans-serif" font-size="112" fill="url(#choc)" stroke="#a46a40" stroke-opacity=".5" stroke-width="1">J</text>
  </g>

  <!-- kaarsen -->
  <g id="cf0"><circle class="halo" cx="345" cy="340" r="64" fill="url(#halo)"/></g>
  <rect x="335" y="356" width="20" height="66" rx="3" fill="url(#wax)"/>
  <path d="M341 356c0 6 2 10 0 16c3-2 4-8 4-16z" fill="#f7ecd2"/>
  <path d="M345 352V358" stroke="#2a1a10" stroke-width="1.6"/>
  <g id="cf0b">
    <path class="flame" d="M345 357C337 351 338 341 345 329C352 341 353 351 345 357Z" fill="url(#flameG)"/>
    <ellipse cx="345" cy="352" rx="2" ry="3.5" fill="#fff" opacity=".8"/>
  </g>

<script>
{
const $ = id => document.getElementById(id);
const R = Math.random;
const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* beeldvullende weergave: schaal het 1600x1000-ontwerp op liggende schermen */
const app = $('app'), root = document.documentElement;
function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  const fitMode = w / h >= 1.2 && w >= 700 && h >= 500;
  root.classList.toggle('fit', fitMode);
  const tr = fitMode ? 'scale(' + Math.min(w / 1600, h / 1000).toFixed(4) + ')' : '';
  app.style.webkitTransform = tr;
  app.style.transform = tr;
}
layout();

/* seizoen: het vuur brandt van 1 november tot en met 5 december */
function inSeason(now) {
  const m = now.getMonth(), d = now.getDate();
  return m === 10 || (m === 11 && d <= 5);
}

/* wijzerplaat */
const roman = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
let dial = '';
for (let i = 0; i < 60; i++) {
  const a = i * Math.PI / 30, major = i % 5 === 0, r1 = major ? 56 : 61, r2 = 65, s = Math.sin(a), c = Math.cos(a);
  dial += `<line x1="${(500 + s * r1).toFixed(2)}" y1="${(236 - c * r1).toFixed(2)}" x2="${(500 + s * r2).toFixed(2)}" y2="${(236 - c * r2).toFixed(2)}" stroke="#3a1a10" stroke-width="${major ? 2.2 : 1}" stroke-linecap="round"/>`;
}
for (let k = 0; k < 12; k++) {
  dial += `<text x="500" y="188" transform="rotate(${k * 30} 500 236)" text-anchor="middle" dominant-baseline="central" font-family="Cinzel, Georgia, serif" font-weight="600" font-size="10.5" fill="#3a1a10">${roman[k]}</text>`;
}
$('dial').innerHTML = dial;

/* slinger met vlaggetjes */
const cols = ['#b3202a', '#d9a93f', '#f3e6c8'];
const P0 = [-10, 26], P1 = [500, 126], P2 = [1010, 26];
let flags = '';
const nFlags = 22;
for (let i = 0; i < nFlags; i++) {
  const t = (i + 0.5) / nFlags, u = 1 - t;
  const x = u * u * P0[0] + 2 * u * t * P1[0] + t * t * P2[0];
  const y = u * u * P0[1] + 2 * u * t * P1[1] + t * t * P2[1];
  const dx = 2 * u * (P1[0] - P0[0]) + 2 * t * (P2[0] - P1[0]);
  const dy = 2 * u * (P1[1] - P0[1]) + 2 * t * (P2[1] - P1[1]);
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  flags += `<path d="M-19 0L19 0L0 44Z" fill="${cols[i % 3]}" stroke="#000" stroke-opacity=".2" transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})"/>`;
}
$('bunting').innerHTML = flags;

/* tekstballon */
const bubble = $('bubble');
let bubT = null;
function say(msg, x, y, ms, side) {
  const right = side ? side === 'r' : x > 550;
  bubble.textContent = msg;
  bubble.classList.toggle('r', right);
  if (right) { bubble.style.left = 'auto'; bubble.style.right = (100 - x / 10) + '%'; }
  else { bubble.style.right = 'auto'; bubble.style.left = (x / 10) + '%'; }
  bubble.style.bottom = (100 - y / 9) + '%';
  bubble.style.maxWidth = `min(${Math.max(30, right ? x / 10 - 3 : 97 - x / 10).toFixed(1)}%, 380px)`;
  bubble.classList.add('show');
  clearTimeout(bubT);
  bubT = setTimeout(() => bubble.classList.remove('show'), ms || 4500);
}

/* easter eggs bijhouden */
const EGGS = ['letter', 'kaars', 'vuur', 'klok', 'staf', 'pepernoten', 'pakjes'];
const found = new Set();
const eggEl = $('eggs');
try { JSON.parse(localStorage.getItem('sk-eggs') || '[]').forEach(e => { if (EGGS.includes(e)) found.add(e); }); } catch (e) {}
function renderEggs() {
  if (!found.size) { eggEl.hidden = true; return; }
  eggEl.hidden = false;
  eggEl.textContent = found.size === EGGS.length ? `Alle ${EGGS.length} Easter eggs gevonden!` : `Easter eggs gevonden: ${found.size} van ${EGGS.length}`;
}
function egg(id) {
  if (found.has(id)) return;
  found.add(id);
  try { localStorage.setItem('sk-eggs', JSON.stringify([...found])); } catch (e) {}
  renderEggs();
  if (found.size === EGGS.length) {
    setTimeout(() => { startRain('confetti'); say(`Alle ${EGGS.length} Easter eggs gevonden! Daar hoort een extra chocoladeletter bij.`, 300, 540, 6000, 'l'); }, 4700);
  }
}
renderEggs();

/* geluid */
let ac = null, master = null, rumble = null, wbuf = null, soundOn = false, crackT = null;
let L = null;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  ac = new AC();
  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  const len = Math.floor(ac.sampleRate * 3);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const w = R() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 500;
  rumble = ac.createGain(); rumble.gain.value = 0.35 * (L === null ? 1 : L);
  src.connect(lp); lp.connect(rumble); rumble.connect(master);
  src.start();
  wbuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.2), ac.sampleRate);
  const wd = wbuf.getChannelData(0);
  for (let i = 0; i < wd.length; i++) wd[i] = R() * 2 - 1;
}
function burst(freq, q, vol, dur, delay) {
  const n = ac.currentTime + delay;
  const src = ac.createBufferSource(); src.buffer = wbuf;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, n);
  g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(n, R() * 0.1, dur + 0.02);
}
function bell(delay, f, vol) {
  if (!ac || !soundOn) return;
  const n = ac.currentTime + delay;
  [1, 2.76, 5.4].forEach((mul, i) => {
    const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f * mul;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime((vol || 0.22) / (i + 1.5), n + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, n + 2.2 / (i + 1));
    o.connect(g); g.connect(master);
    o.start(n); o.stop(n + 2.4);
  });
}
function crackleLoop() {
  if (!soundOn) return;
  const lvl = L === null ? 1 : L;
  if (lvl > 0.03) {
    const count = R() < 0.15 ? 3 + Math.floor(R() * 4) : 1;
    for (let i = 0; i < count; i++) burst(1200 + R() * 4000, 1 + R() * 3, (0.05 + R() * 0.35) * lvl, 0.02 + R() * 0.06, i * 0.015 + R() * 0.02);
  }
  crackT = setTimeout(crackleLoop, 40 + R() * 260);
}
function tick(hi) { if (ac) burst(hi ? 3400 : 2600, 6, 0.5, 0.035, 0); }
const btn = $('sound');
btn.addEventListener('click', () => {
  try {
    if (!ac) initAudio();
    soundOn = !soundOn;
    btn.textContent = soundOn ? 'Haardgeluid: aan' : 'Haardgeluid: uit';
    btn.classList.toggle('on', soundOn);
    clearTimeout(crackT);
    master.gain.cancelScheduledValues(ac.currentTime);
    if (soundOn) {
      const p = ac.resume(); if (p && p.catch) p.catch(() => {});
      master.gain.setTargetAtTime(0.8, ac.currentTime, 0.15);
      crackleLoop();
    } else {
      master.gain.setTargetAtTime(0, ac.currentTime, 0.08);
    }
  } catch (e) {
    soundOn = false;
    btn.disabled = true;
    btn.classList.remove('on');
    btn.textContent = 'Geluid niet beschikbaar';
  }
});

/* Sinterklaasradio: live internetradio met automatische terugval */
const STATIONS = [
  { name: 'SinterklaasRadio', urls: ['https://stream06.dotpoint.nl:8004/stream', 'https://stream02.dotpoint.nl:8000/radio.mp3'] },
  { name: 'Sint FM', urls: ['https://stream.tbmp.nl:8000/sinterklaasradiohigh.mp3'] }
];
const radioBtn = $('radio'), radioSel = $('radioSel'), radioStat = $('radioStat');
radioSel.innerHTML = STATIONS.map((st, i) => `<option value="${i}">${st.name}</option>`).join('');
let audio = null, radioOn = false, queue = [], qi = 0, attempt = 0, connectT = null;
function radioIdle() {
  radioStat.textContent = inSeason(new Date()) ? 'Live Sinterklaasliedjes via internetradio.' : 'Let op: de Sinterklaaszenders draaien meestal alleen tot en met 5 december.';
}
function radioUI() {
  radioBtn.textContent = radioOn ? 'Radio: aan' : 'Radio: uit';
  radioBtn.classList.toggle('on', radioOn);
}
function radioFail(a) { if (a === attempt && radioOn) tryNextStream(); }
function tryNextStream() {
  clearTimeout(connectT);
  if (!radioOn) return;
  if (qi >= queue.length) {
    stopRadio();
    radioStat.textContent = 'Geen zender bereikbaar. Mogelijk blokkeert het netwerk de stream, of de zender is uit de lucht.';
    return;
  }
  const item = queue[qi++], my = ++attempt;
  audio.dataset.st = item.i;
  radioStat.textContent = `Verbinden met ${STATIONS[item.i].name}...`;
  audio.src = item.u;
  let p;
  try { p = audio.play(); } catch (e) { radioFail(my); return; }
  if (p && p.catch) p.catch(err => {
    if (my !== attempt) return;
    if (err && err.name === 'NotAllowedError') { stopRadio(); radioStat.textContent = 'De browser hield het geluid tegen. Klik nog een keer op Radio.'; }
    else if (!err || err.name !== 'AbortError') radioFail(my);
  });
  connectT = setTimeout(() => radioFail(my), 9000);
}
function startRadio() {
  if (!audio) {
    audio = document.createElement('audio');
    audio.preload = 'none';
    audio.hidden = true;
    document.body.appendChild(audio);
    audio.addEventListener('playing', () => {
      clearTimeout(connectT);
      if (radioOn) radioStat.textContent = `Speelt nu: ${STATIONS[+audio.dataset.st].name}`;
    });
    audio.addEventListener('error', () => radioFail(attempt));
  }
  const start = +radioSel.value || 0;
  queue = [];
  [start].concat(STATIONS.map((_, i) => i).filter(i => i !== start)).forEach(i => STATIONS[i].urls.forEach(u => queue.push({ i: i, u: u })));
  qi = 0;
  radioOn = true;
  radioUI();
  tryNextStream();
}

function startRain(kind) {
  RW = window.innerWidth; RH = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  rain.width = Math.round(RW * dpr); rain.height = Math.round(RH * dpr);
  rc.setTransform(dpr, 0, 0, dpr, 0, 0);
  const conf = kind === 'confetti', n = reduce ? 50 : (conf ? 170 : 140);
  for (let i = 0; i < n; i++) {
    drops.push({ conf, x: R() * RW, y: -20 - R() * RH * 1.2, vy: (conf ? 110 : 260) + R() * 240, vx: (R() - 0.5) * 60, r: conf ? 4 + R() * 4 : 5 + R() * 5, a: R() * 6.28, va: (R() - 0.5) * 8, c: confCols[Math.floor(R() * confCols.length)], seed: R() * 6.28 });
  }
  if (raining) return;
  raining = true;
  let lt = performance.now();
  const step = t => {
    const dt = Math.min(0.05, Math.max(0, (t - lt) / 1000)); lt = t;
    rc.clearRect(0, 0, RW, RH);
    drops = drops.filter(d => d.y < RH + 30);
    for (const d of drops) {
      d.y += d.vy * dt;
      d.x += (d.vx + (d.conf ? Math.sin(t / 300 + d.seed) * 40 : 0)) * dt;
      d.a += d.va * dt;
      rc.save(); rc.translate(d.x, d.y); rc.rotate(d.a);
      if (d.conf) { rc.fillStyle = d.c; rc.fillRect(-d.r, -d.r * 0.45, d.r * 2, d.r * 0.9); }
      else {
        rc.fillStyle = '#8e4f25'; rc.beginPath(); rc.arc(0, 0, d.r, 0, Math.PI * 2); rc.fill();
        rc.fillStyle = 'rgba(201,138,82,.75)'; rc.beginPath(); rc.arc(-d.r * 0.3, -d.r * 0.35, d.r * 0.42, 0, Math.PI * 2); rc.fill();
      }
      rc.restore();
    }
    if (drops.length) requestAnimationFrame(step);

}

  else if (peperTaps.length === 1) say('Mmm, pepernoten. Niet allemaal tegelijk opeten!', 640, 836, 2500, 'r');
});

/* aftellen tot de kerstvakantie (officiële data Rijksoverheid, daarna: zaterdag tussen 19 en 25 december) */
const XMAS = [['2025-12-20', '2026-01-04'], ['2026-12-19', '2027-01-03'], ['2027-12-25', '2028-01-09'], ['2028-12-23', '2029-01-07'], ['2029-12-22', '2030-01-06']];
function ymd(str) { const p = str.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function xmasFor(year) {
  const hit = XMAS.find(x => x[0].startsWith(year + '-'));
  if (hit) return [ymd(hit[0]), ymd(hit[1])];
  let st = new Date(year, 11, 19);
  while (st.getDay() !== 6) st = new Date(year, 11, st.getDate() + 1);
  return [st, new Date(year, 11, st.getDate() + 15)];
}
const fmtLong = new Intl.DateTimeFormat('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtLongY = new Intl.DateTimeFormat('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const xmTitle = $('xmTitle'), xmSub = $('xmSub'), xmSchool = $('xmSchool'), xmRow = $('xmRow');
const xmD = $('xmD'), xmH = $('xmH'), xmM = $('xmM'), xmS = $('xmS');
function updXmas(now) {
  const y = now.getFullYear();
  let cur = null, next = null;
  for (const yy of [y - 1, y, y + 1]) {
    const [st, en] = xmasFor(yy);
    const endExcl = new Date(en.getFullYear(), en.getMonth(), en.getDate() + 1);
    if (now >= st && now < endExcl) { cur = [st, en]; break; }
    if (now < st && !next) next = [st, en];
  }
  if (cur) {
    const today = Date.UTC(y, now.getMonth(), now.getDate());
    const left = Math.round((Date.UTC(cur[1].getFullYear(), cur[1].getMonth(), cur[1].getDate()) - today) / 864e5) + 1;
    xmTitle.textContent = 'Het is kerstvakantie!';
    xmSub.textContent = `Nog ${left} ${left === 1 ? 'dag' : 'dagen'} vrij, tot en met ${fmtLongY.format(cur[1])}.`;
    xmSchool.textContent = 'Geniet ervan!';
    xmRow.hidden = true;
    return;
  }
  const [st, en] = next;
  xmRow.hidden = false;
  xmTitle.textContent = 'Aftellen tot de kerstvakantie';
  xmSub.textContent = `Van ${fmtLong.format(st)} tot en met ${fmtLongY.format(en)}.`;
  let diff = Math.max(0, Math.floor((st - now) / 1000));
  const dd = Math.floor(diff / 86400); diff -= dd * 86400;
  const hrs = Math.floor(diff / 3600); diff -= hrs * 3600;
  const mins = Math.floor(diff / 60), secs = diff - mins * 60;
  xmD.textContent = dd; xmH.textContent = pad(hrs); xmM.textContent = pad(mins); xmS.textContent = pad(secs);
  let n = 0;
  let d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (now.getHours() >= 17 ? 1 : 0));
  while (d < st) { const wd = d.getDay(); if (wd !== 0 && wd !== 6) n++; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); }
  if (dd > 45) { xmSchool.textContent = `Nog ${Math.ceil(dd / 7)} weken te gaan.`; return; }
  xmSchool.textContent = n === 0 ? 'Geen schooldagen meer: de vakantie staat voor de deur!' : `Nog ${n} ${n === 1 ? 'schooldag' : 'schooldagen'} te gaan.`;
}

/* fouten melden zonder dat de rest stopt */
let reported = 0;
function report(e) { if (reported++ < 5 && window.__skErr) window.__skErr.push('JS: ' + (e && e.message ? e.message : e)); }

/* animatielus */
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
  lastT = t;
  const now = new Date();
  requestAnimationFrame(frame);
  try { updClock(now); } catch (e) { report(e); }
  try { fire(dt, t / 1000, now); window.__skFrames = (window.__skFrames || 0) + 1; } catch (e) { report(e); }
}
try { updClock(new Date()); } catch (e) { report(e); }
try { fire(0, performance.now() / 1000, new Date()); } catch (e) { report(e); }
requestAnimationFrame(frame);
}
